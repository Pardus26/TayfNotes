name: Android CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    
    - name: set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build with Gradle
      run: ./gradlew assembleDebug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: TayfNotes-APKs
        path: app/build/outputs/apk/debug/TayfNotes_v*.apk

    - name: Shielded Source Code Backup
      run: |
        BUILD_NO=${{ github.run_number }}
        COMMIT_SHA=$(git rev-parse --short HEAD)
        SUFFIX="-${BUILD_NO}_${COMMIT_SHA}"
        BACKUP_DIR="source_backup_${BUILD_NO}"
        mkdir -p "$BACKUP_DIR"
        
        echo "Starting advanced file renaming and backup..."
        
        # Define files to include: source code, build scripts, configurations
        # We use 'find' to get all files except unwanted directories
        find . -type f \
          -not -path '*/.*' \
          -not -path '*/build/*' \
          -not -path '*/app/build/*' \
          -not -path '*/shared/build/*' \
          -not -path '*/.gradle/*' \
          -not -name "*.apk" \
          -not -name "*.zip" | while read file; do
            
            # Remove leading './' if present
            clean_path="${file#./}"
            
            # Prepare destination path
            dest_file="$BACKUP_DIR/${clean_path}${SUFFIX}"
            dest_dir=$(dirname "$dest_file")
            
            # Ensure target directory exists in backup
            mkdir -p "$dest_dir"
            
            # Copy and rename
            cp "$file" "$dest_file"
        done
        
        # Create the zip file with the dynamic name
        ZIP_NAME="sourcecodes_${BUILD_NO}_${COMMIT_SHA}.zip"
        cd "$BACKUP_DIR" && zip -r "../$ZIP_NAME" . && cd ..
        
        echo "ZIP_FILE=$ZIP_NAME" >> $GITHUB_ENV
        echo "Backup completed: $ZIP_NAME"

    - name: Upload Source Code Backup
      uses: actions/upload-artifact@v4
      with:
        name: TayfNotes-SourceCode-Backup
        path: ${{ env.ZIP_FILE }}
